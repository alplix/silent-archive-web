name: Sync save / leaderboard

# Reacts to issues whose title starts with "sync:" — either the one auto-save
# issue the game keeps per player (title "sync: auto", created/edited through
# the GitHub API with the player's own token) or a one-off manual one opened
# from the "Sync to GitHub" dialog. Writes saves/<author>.json and
# leaderboard.json on the `player-data` branch (not `main`, so progress syncs
# never trigger a GitHub Pages rebuild), using the issue's real author as
# identity — never anything the issue body claims — so a player can only
# overwrite their own data. See js/auth.js and .github/scripts/sync-issue.js.
#
# SECURITY: issue titles/bodies are attacker-controlled. Never interpolate
# ${{ ... }} expressions derived from them (or from step outputs that echo
# them) into a `run:` script — pass them through `env:` and reference the
# shell variable instead.

on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  issues: write

jobs:
  sync:
    if: startsWith(github.event.issue.title, 'sync:')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_USER: ${{ github.event.issue.user.login }}
      ISSUE_TITLE: ${{ github.event.issue.title }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          ref: player-data
          path: player-data

      - name: Process the sync issue and commit
        id: sync
        run: |
          RESULT="$RUNNER_TEMP/result.json"
          export RESULT_PATH="$RESULT"
          export DATA_DIR="$GITHUB_WORKSPACE/player-data"
          status="error"
          message="Could not push to the player-data branch."
          username=""
          for i in 1 2 3 4 5; do
            git -C player-data fetch -q origin player-data
            git -C player-data reset -q --hard origin/player-data
            # Always read the issue's CURRENT body, not the event's snapshot,
            # so two close-together edits converge on the newest one.
            ISSUE_BODY="$(gh api "repos/$REPO/issues/$ISSUE_NUMBER" --jq .body)"
            export ISSUE_BODY
            rm -f "$RESULT"
            node .github/scripts/sync-issue.js
            status="$(jq -r .status "$RESULT")"
            message="$(jq -r .message "$RESULT")"
            username="$(jq -r '.username // ""' "$RESULT")"
            [ "$status" = "ok" ] || break
            git -C player-data add -A
            git -C player-data -c user.name="github-actions[bot]" \
              -c user.email="github-actions[bot]@users.noreply.github.com" \
              commit -q -m "sync: $username"
            if git -C player-data push -q origin HEAD:player-data; then
              break
            fi
            status="error"
            message="Could not push to the player-data branch."
            sleep $((RANDOM % 6 + 2))
          done
          {
            echo "status=$status"
            echo "message=$message"
          } >> "$GITHUB_OUTPUT"

      - name: Report result on the issue
        env:
          SYNC_STATUS: ${{ steps.sync.outputs.status }}
          SYNC_MESSAGE: ${{ steps.sync.outputs.message }}
        run: |
          # The persistent auto-save issue stays open and quiet on success;
          # manual one-off issues get a comment and are closed.
          manual=true
          if [ "$ISSUE_TITLE" = "sync: auto" ]; then manual=false; fi
          if [ "$SYNC_STATUS" = "ok" ]; then
            if [ "$manual" = true ]; then
              gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body "✅ $SYNC_MESSAGE"
              gh issue close "$ISSUE_NUMBER" --repo "$REPO"
            fi
          else
            gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body "❌ Could not sync: $SYNC_MESSAGE"
            if [ "$manual" = true ]; then
              gh issue close "$ISSUE_NUMBER" --repo "$REPO"
            fi
          fi
