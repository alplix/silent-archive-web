<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sessiz Arşiv / The Silent Archive</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="toast-stack"></div>
<div id="tension-vignette"></div>

<div id="lang-switch" class="lang-switch">
  <select id="lang-select" aria-label="Language"></select>
</div>

<div id="boot-screen" class="screen">
  <pre class="logo">   ___  ___ _ ___  _  _ ___ _____
  / __|/ __(_) _ \| \| | __|_   _|
  \__ \ (__| |  _/| .` | _|  | |
  |___/\___|_|_|  |_|\_|___| |_|</pre>
  <p class="dim" data-i18n="boot_connecting">…</p>
</div>

<div id="auth-screen" class="screen hidden">
  <pre class="logo">   ___  ___ _ ___  _  _ ___ _____
  / __|/ __(_) _ \| \| | __|_   _|
  \__ \ (__| |  _/| .` | _|  | |
  |___/\___|_|_|  |_|\_|___| |_|</pre>
  <div class="panel">
    <button id="play-btn" class="play-btn" data-i18n="btn_play">...</button>
  </div>
</div>

<div id="game-screen" class="screen hidden">
  <div id="topbar">
    <span class="topbar-left">
      <button id="sidebar-toggle" class="link-btn" aria-label="menu">☰</button>
    </span>
    <span class="topbar-actions">
      <button id="sfx-toggle" class="link-btn">🔊</button>
      <button id="savefile-btn" class="link-btn" data-i18n="savefile_btn">…</button>
      <button id="tutorial-btn" class="link-btn" data-i18n="tut_button">…</button>
    </span>
  </div>

  <div id="game-body">
    <div id="sidebar">
      <div id="dashboard">
        <div class="stat-row"><span class="stat-label" data-i18n="st_clearance">…</span><span id="stat-clearance" class="stat-val"></span></div>
        <div class="stat-row"><span class="stat-label" data-i18n="st_findings">…</span><span id="stat-findings" class="stat-val"></span></div>
        <div class="stat-block">
          <div class="stat-block-top"><span class="stat-label" data-i18n="st_day">…</span><span id="stat-day" class="stat-val"></span></div>
          <div class="meter"><div id="meter-day" class="meter-fill day"></div></div>
        </div>
        <div class="stat-block">
          <div class="stat-block-top"><span class="stat-label" data-i18n="st_contam">…</span><span id="stat-contam-pct" class="stat-val"></span></div>
          <div class="meter"><div id="meter-contam" class="meter-fill"></div></div>
        </div>
        <div class="stat-block">
          <div class="stat-block-top"><span id="stat-rank" class="stat-val rank"></span><span id="stat-xp" class="stat-val"></span></div>
          <div class="meter"><div id="meter-xp" class="meter-fill xp"></div></div>
        </div>
      </div>

      <div id="cross-tray" class="hidden">
        <div id="cross-tray-label" data-i18n="cross_tray_hint">…</div>
        <div id="cross-tray-picks"></div>
        <button id="cross-tray-go" data-i18n="cross_tray_go">…</button>
      </div>

      <div id="browser-tabs" class="tabs mini">
        <button class="rb-tab active" data-tab="records" data-i18n="browser_tab_records">…</button>
        <button class="rb-tab" data-tab="findings" data-i18n="browser_tab_findings">…</button>
      </div>
      <input id="rb-search" type="text" data-i18n-ph="browser_search_ph" autocomplete="off">
      <div id="record-browser"></div>
    </div>

    <div id="main-pane">
      <div id="terminal"></div>
      <div id="input-row">
        <span id="prompt-tag">&gt;</span>
        <input type="text" id="cmd-input" autocomplete="off" autocapitalize="off" spellcheck="false">
      </div>
    </div>
  </div>
</div>

<div id="tutorial-modal" class="modal hidden">
  <div class="modal-box">
    <h2 data-i18n="tut_title">…</h2>
    <div id="tutorial-body"></div>
    <button id="tutorial-close" data-i18n="tut_close">…</button>
  </div>
</div>

<div id="savefile-modal" class="modal hidden">
  <div class="modal-box">
    <h2 data-i18n="savefile_title">…</h2>
    <p class="small" data-i18n="savefile_help">…</p>
    <div class="modal-actions">
      <button id="savefile-download" data-i18n="savefile_download">…</button>
      <button id="savefile-load" class="secondary" data-i18n="savefile_load">…</button>
      <input id="savefile-input" type="file" accept=".json,application/json" class="hidden">
    </div>
    <p id="savefile-status" class="err"></p>
    <div class="modal-actions">
      <button id="savefile-close" class="secondary" data-i18n="btn_close">…</button>
    </div>
  </div>
</div>

<script src="js/languages.js"></script>
<script src="js/engine.js"></script>
<script src="js/i18n.js"></script>
<script src="js/sfx.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
