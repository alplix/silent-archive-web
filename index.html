<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sessiz Arşiv / The Silent Archive</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="lang-switch" class="lang-switch">
  <button class="lang-opt" data-lang="tr">TR</button>
  <span class="lang-sep">/</span>
  <button class="lang-opt" data-lang="en">EN</button>
</div>

<div id="boot-screen" class="screen">
  <pre class="logo">   ___  ___ _ ___  _  _ ___ _____
  / __|/ __(_) _ \| \| | __|_   _|
  \__ \ (__| |  _/| .` | _|  | |
  |___/\___|_|_|  |_|\_|___| |_|</pre>
  <p class="dim" data-i18n="boot_connecting">…</p>
</div>

<div id="auth-screen" class="screen hidden">
  <pre class="logo">   ___  ___ _ ___  _  _ ___ _____
  / __|/ __(_) _ \| \| | __|_   _|
  \__ \ (__| |  _/| .` | _|  | |
  |___/\___|_|_|  |_|\_|___| |_|</pre>
  <div class="panel">
    <div id="auth-tabs" class="tabs">
      <button class="tab active" data-tab="login" data-i18n="tab_login">…</button>
      <button class="tab" data-tab="register" data-i18n="tab_register">…</button>
    </div>

    <form id="login-form" class="auth-form">
      <label><span data-i18n="lbl_email">…</span><input type="email" id="login-email" required autocomplete="email"></label>
      <label><span data-i18n="lbl_password">…</span><input type="password" id="login-password" required autocomplete="current-password"></label>
      <button type="submit" data-i18n="btn_signin">…</button>
      <p class="err" id="login-err"></p>
    </form>

    <form id="register-form" class="auth-form hidden">
      <label><span data-i18n="lbl_name">…</span><input type="text" id="register-name" required maxlength="24"></label>
      <label><span data-i18n="lbl_email">…</span><input type="email" id="register-email" required autocomplete="email"></label>
      <label><span data-i18n="lbl_password">…</span><input type="password" id="register-password" required minlength="6" autocomplete="new-password"></label>
      <button type="submit" data-i18n="btn_register">…</button>
      <p class="err" id="register-err"></p>
    </form>

    <div class="or-row"><span data-i18n="or_row">…</span></div>
    <button id="google-btn" class="secondary" data-i18n="btn_google">…</button>
    <button id="guest-btn" class="secondary" data-i18n="btn_guest">…</button>
  </div>
</div>

<div id="game-screen" class="screen hidden">
  <div id="topbar">
    <span id="topbar-user"></span>
    <span class="topbar-actions">
      <button id="tutorial-btn" class="link-btn" data-i18n="tut_button">…</button>
      <button id="leaderboard-btn" class="link-btn" data-i18n="nav_leaderboard">…</button>
      <button id="logout-btn" class="link-btn" data-i18n="nav_logout">…</button>
    </span>
  </div>
  <div id="terminal"></div>
  <div id="input-row">
    <span id="prompt-tag">&gt;</span>
    <input type="text" id="cmd-input" autocomplete="off" autocapitalize="off" spellcheck="false">
  </div>
</div>

<div id="tutorial-modal" class="modal hidden">
  <div class="modal-box">
    <h2 data-i18n="tut_title">…</h2>
    <div id="tutorial-body"></div>
    <button id="tutorial-close" data-i18n="tut_close">…</button>
  </div>
</div>

<div id="leaderboard-modal" class="modal hidden">
  <div class="modal-box">
    <h2 data-i18n="lb_title">…</h2>
    <table id="leaderboard-table">
      <thead><tr>
        <th>#</th>
        <th data-i18n="lb_col_name">…</th>
        <th data-i18n="lb_col_rank">…</th>
        <th data-i18n="lb_col_xp">…</th>
        <th data-i18n="lb_col_findings">…</th>
      </tr></thead>
      <tbody></tbody>
    </table>
    <button id="leaderboard-close" data-i18n="btn_close">…</button>
  </div>
</div>

<script type="module" src="js/firebase-config.js"></script>
<script type="module" src="js/auth.js"></script>
<script src="js/engine.js"></script>
<script src="js/i18n.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
